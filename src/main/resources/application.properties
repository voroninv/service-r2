spring.application.name=service-r2
server.port=8082
server.servlet.context-path=/r2

auth.token=servicer2token

database.url=${DATABASE_URL:jdbc:mysql://localhost:3306/dbone}
database.username=${DATABASE_USERNAME:root}
database.password=${DATABASE_PASSWORD:1234}
database.driver=com.mysql.cj.jdbc.Driver

eureka.instance.metadata-map.service.r2.context=/r2
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://localhost:8761/eureka/}